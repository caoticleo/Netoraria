name: Validate Wiki
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check src/app.js
      - name: Verify required wiki artifacts
        run: test -s index.html && test -s AGENTS.md && test -s README.md
      - uses: actions/upload-artifact@v4
        with:
          name: netoraria-private-preview
          path: |
            index.html
            src/app.js
            README.md
