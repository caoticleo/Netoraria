name: Validate Wiki
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check src/catalog.js
          node --check src/app.js
          node --check src/network.js
          node --check src/lineage.js
          node --check src/discovery.js
          node --check src/coverage.js
          node scripts/check-catalog.mjs
      - name: Verify required wiki artifacts
        run: test -s index.html && test -s AGENTS.md && test -s README.md && test -s src/catalog.js && test -s src/network.js && test -s src/lineage.js && test -s src/lineage.css && test -s src/discovery.css && test -s src/coverage.css && test -s data/catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: netoraria-private-preview
          path: |
            index.html
            src/
            data/catalog.json
            docs/
            README.md
            AGENTS.md
